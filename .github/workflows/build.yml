name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Restore (locked package versions)
        run: dotnet restore tests/VrModTagger.Tests --locked-mode
      - name: Test
        run: dotnet test tests/VrModTagger.Tests -c Release --no-restore
      - name: Pack
        shell: pwsh
        run: ./pack.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pext
          path: dist/*.pext
