name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/VrModTagger.Tests -c Release
      - name: Pack
        shell: pwsh
        run: ./pack.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: pext
          path: dist/*.pext
