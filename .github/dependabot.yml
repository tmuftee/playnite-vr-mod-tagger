# Proposes updates for the pinned GitHub actions and NuGet packages, including security fixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directories: [/src/VrModTagger, /tests/VrModTagger.Tests]
    schedule:
      interval: monthly
    ignore:
      # The SDK version sets the oldest Playnite the add-on runs on; it's raised on purpose, not automatically.
      - dependency-name: PlayniteSDK
